name: study-log-append

on:
  repository_dispatch:
    types: [study-log-entry]

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: render and insert
        env:
          TEXT: "${{ github.event.client_payload.log.text }}"
          SOLVED: "${{ github.event.client_payload.log.solved }}"
          CHAPTER: "${{ github.event.client_payload.log.chapter }}"
          CATEGORY: "${{ github.event.client_payload.log.category }}"
          TIME_TOTAL: "${{ github.event.client_payload.log.time_total }}"
          RATE: "${{ github.event.client_payload.log.rate }}"
          LONGEST_CAT: "${{ github.event.client_payload.log.longest_cat }}"
          LONGEST_NO: "${{ github.event.client_payload.log.longest_no }}"
          LONGEST_TIME: "${{ github.event.client_payload.log.longest_time }}"
          WRONG_CAT: "${{ github.event.client_payload.log.wrong_cat }}"
          WRONG_NO: "${{ github.event.client_payload.log.wrong_no }}"
        run: |
          BODY=$(cat <<TXT
          📗 基本情報テキスト：${TEXT}  
          ✏️ 解いた問題数：${SOLVED}問  
          🔢 ${CHAPTER}  
          🎨 カテゴリー：${CATEGORY}  
          🕰️ 解答時間合計：${TIME_TOTAL}  
          ⭕️ 正答率：${RATE}%  
          ⚠️ 最長解答問題：【${LONGEST_CAT}】No.${LONGEST_NO} ／ ${LONGEST_TIME}  
          ❌ 間違えた問題：【${WRONG_CAT}】No.${WRONG_NO}
          TXT
          )
          echo "$BODY" | python3 scripts/add_entry.py --label FE_B

      - name: commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "study log: $(TZ=Asia/Tokyo date +%F)" || { echo "no changes"; exit 0; }
          git push origin HEAD:main
