name: study-log-append
on:
 repository_dispatch:
  types: [study-log-entry]

permissions:
  contents:write

jobs:
 append:
  runs-on: ubuntu-latest
 steps:
   - uses: actions/checkout@v4
     with:
      ref: study-log

   - name: render & append 
     env:
      TEXT:  ${{ github.event.client_payload.log.text }}
      SOLVED:       ${{ github.event.client_payload.log.solved }}
          CHAPTER:      ${{ github.event.client_payload.log.chapter }}
          CATEGORY:     ${{ github.event.client_payload.log.category }}
          TIME_TOTAL:   ${{ github.event.client_payload.log.time_total }}
          RATE:         ${{ github.event.client_payload.log.rate }}
          LONGEST_CAT:  ${{ github.event.client_payload.log.longest_cat }}
          LONGEST_NO:   ${{ github.event.client_payload.log.longest_no }}
          LONGEST_TIME: ${{ github.event.client_payload.log.longest_time }}
          WRONG_CAT:    ${{ github.event.client_payload.log.wrong_cat }}
          WRONG_NO:     ${{ github.event.client_payload.log.wrong_no }}
run: |
 python3 - <<'PY'
 import os, pathlib, datetime, zoneinfo
 date = datetime.datetime.now(zoneinfo.ZoneInfo("Asia/Tokyo")).strftime("%Y-%m-%d")
          tpl = pathlib.Path("templates/study_log_entry.md").read_text(encoding="utf-8")

          mapping = {
              "date": date,
              "text": os.environ.get("TEXT",""),
              "solved": os.environ.get("SOLVED",""),
              "chapter": os.environ.get("CHAPTER",""),
              "category": os.environ.get("CATEGORY",""),
              "time_total": os.environ.get("TIME_TOTAL",""),
              "rate": os.environ.get("RATE",""),
              "longest_cat": os.environ.get("LONGEST_CAT",""),
              "longest_no": os.environ.get("LONGEST_NO",""),
              "longest_time": os.environ.get("LONGEST_TIME",""),
              "wrong_cat": os.environ.get("WRONG_CAT",""),
              "wrong_no": os.environ.get("WRONG_NO",""),
          }
          for k, v in mapping.items():
              tpl = tpl.replace("{{"+k+"}}", str(v))

          out = pathlib.Path(f"logs/{date[:7]}.md")   # 月別 例: logs/2026-08.md
          out.parent.mkdir(parents=True, exist_ok=True)
          with out.open("a", encoding="utf-8") as f:
              f.write(tpl + "\n")
          PY

      - name: commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/
          git commit -m "study log: $(TZ=Asia/Tokyo date +%F)" || { echo "no changes"; exit 0; }
          git push origin HEAD:study-log
